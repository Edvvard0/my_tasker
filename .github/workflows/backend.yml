name: backend

on:
  push:
    paths:
      - "backend/**"
      - "deploy/**"
      - "shared-test-vectors/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - "shared-test-vectors/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          # Throw-away CI database, reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: pytest (coverage gate 90%)
        run: uv run pytest --cov-fail-under=90

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        working-directory: deploy
        env:
          # Placeholders: `config` only checks that required variables are set.
          SERVER_IP: 127.0.0.1
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: placeholder
          APP_SECRET_KEY: placeholder
        run: docker compose -f docker-compose.yml config -q
      - name: Build backend image
        run: docker build -f deploy/Dockerfile -t my-tasker-backend:ci backend
      - name: Image runs as non-root and imports the app
        run: |
          test "$(docker run --rm my-tasker-backend:ci id -u)" != "0"
          docker run --rm my-tasker-backend:ci python -c "import tasker.main, tasker.worker.runner"
      - name: Validate Caddyfile
        run: >-
          docker run --rm -e SERVER_IP=127.0.0.1
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compose smoke test
        working-directory: deploy
        run: |
          # Throw-away credentials, exist only inside this job.
          {
            echo "SERVER_IP=127.0.0.1"
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_DB=ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --build --wait --wait-timeout 240
          # The internal CA issues the certificate on first start: retry briefly.
          curl -fsk --retry 15 --retry-delay 2 --retry-all-errors https://127.0.0.1/health/ready
      - name: Owner via CLI, login through Caddy, authenticated calls
        working-directory: deploy
        run: |
          set -euo pipefail
          # Throw-away owner password and TOTP secret; masked so they never reach the log.
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          printf '%s\n' "$PASSWORD" \
            | docker compose exec -T api python -m tasker.cli user create --password-stdin --json \
            > "$RUNNER_TEMP/owner.json"
          SECRET="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["totp_secret"])' "$RUNNER_TEMP/owner.json")"
          echo "::add-mask::$SECRET"
          rm -f "$RUNNER_TEMP/owner.json"

          # RFC 6238 (SHA-1, 6 digits, 30 s): the server accepts the neighbouring steps too.
          CODE="$(python3 - "$SECRET" <<'PY'
          import base64, hashlib, hmac, struct, sys, time
          key = base64.b32decode(sys.argv[1] + "=" * (-len(sys.argv[1]) % 8))
          digest = hmac.new(key, struct.pack(">Q", int(time.time() // 30)), hashlib.sha1).digest()
          offset = digest[-1] & 0x0F
          number = struct.unpack(">I", digest[offset : offset + 4])[0] & 0x7FFFFFFF
          print(str(number % 10**6).zfill(6))
          PY
          )"
          echo "::add-mask::$CODE"

          LOGIN_BODY="$(PASSWORD="$PASSWORD" CODE="$CODE" python3 -c 'import json,os; print(json.dumps({"password": os.environ["PASSWORD"], "totp_code": os.environ["CODE"], "device": {"name": "ci", "platform": "linux"}}))')"
          LOGIN="$(curl -fsk https://127.0.0.1/auth/login \
            -H 'Content-Type: application/json' -H 'X-Client-Schema-Version: 1' -d "$LOGIN_BODY")"
          TOKEN="$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::$TOKEN"
          EPOCH="$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["server_epoch"])')"

          # Authenticated endpoints through the proxy.
          DEVICES="$(curl -fsk https://127.0.0.1/auth/devices -H "Authorization: Bearer $TOKEN")"
          printf '%s' "$DEVICES" | python3 -c 'import json,sys; d = json.load(sys.stdin)["devices"]; assert len(d) == 1 and d[0]["is_current"], d'
          PULL="$(curl -fsk 'https://127.0.0.1/sync/pull?since=0' \
            -H "Authorization: Bearer $TOKEN" -H 'X-Client-Schema-Version: 1')"
          printf '%s' "$PULL" | EPOCH="$EPOCH" python3 -c 'import json,os,sys; p = json.load(sys.stdin); assert p["server_epoch"] == os.environ["EPOCH"] and p["changes"] == [], p'
          VERSION="$(curl -fsk https://127.0.0.1/version)"
          printf '%s' "$VERSION" | EPOCH="$EPOCH" python3 -c 'import json,os,sys; assert json.load(sys.stdin)["server_epoch"] == os.environ["EPOCH"]'

          # Unauthenticated calls are refused, the CLI admin commands work inside the container.
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/auth/devices)" = 401
          docker compose exec -T api python -m tasker.cli epoch show
          docker compose exec -T api python -m tasker.cli user unlock
      - name: Dump compose logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Compose down
        if: always()
        working-directory: deploy
        run: docker compose down -v --remove-orphans

[project]
name = "tasker"
version = "0.1.0"
description = "My Tasker backend: FastAPI api and worker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "cryptography==50.0.1",
    "fastapi==0.142.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dateutil==2.9.0.post0",
    "sqlalchemy[asyncio]==2.1.1",
    "tzdata==2026.4",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
    "pdfplumber==0.11.10",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasker"]

[dependency-groups]
dev = [
    "fpdf2==2.8.9",
    "hypothesis==6.168.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "types-openpyxl==3.1.5.20260827",
    "types-python-dateutil==2.9.0.20260807",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "ASYNC", "S", "C4", "SIM", "PT", "RUF", "T20", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607", "PLR0913", "PLR0917", "SLF001", "RUF001", "RUF003"]
"tests/ai/**" = ["PT018", "RUF015", "ASYNC110", "E501", "S608"]
"src/tasker/money.py" = ["RUF001", "RUF003"]
"src/tasker/migrations/**" = ["N999"]
"src/tasker/cli.py" = ["T201"]
"src/tasker/sync/**" = ["PLR0913", "PLR0917"]
"src/tasker/ai/**" = ["PLR0913", "PLR0917"]
"src/tasker/work/**" = ["PLR0913", "PLR0917", "PLR0911", "PLR0912"]
"src/tasker/work/tools.py" = ["RUF001", "RUF003"]
"src/tasker/finance/**" = ["PLR0913", "PLR0917", "PLR0911", "PLR0912"]
"src/tasker/files/**" = ["PLR0911"]
"src/tasker/banks/**" = ["PLR0913", "PLR0917", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]
"src/tasker/study/**" = ["PLR0913", "PLR0917", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]
"src/tasker/finance/presets.py" = ["RUF001", "RUF003"]
"src/tasker/finance/tools.py" = ["RUF001", "RUF003"]
"src/tasker/ai/agents.py" = ["RUF001", "RUF003"]
"src/tasker/ai/context.py" = ["RUF001", "RUF003"]
"src/tasker/ai/tools*.py" = ["RUF001", "RUF003"]
"src/tasker/auth/service.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tasker --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tasker"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

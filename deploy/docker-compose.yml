# Run from this directory: docker compose up -d --build
# Values come from deploy/.env (copy .env.example and fill it in).

x-backend: &backend
  image: my-tasker-backend:local
  build:
    context: ../backend
    dockerfile: ../deploy/Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    APP_ENV: ${APP_ENV:-prod}
    # Signs access tokens and encrypts the TOTP secret. Keep it stable: after a change nobody can
    # sign in (the TOTP secret is unreadable) until `python -m tasker.cli user reset`; signed-in
    # devices keep working, they only get new access tokens through their refresh tokens.
    APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY}
    # The api sits behind Caddy, which sets X-Forwarded-For to the real client address.
    TRUST_FORWARDED_FOR: "true"
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # AI chat provider (stage 3); empty values mean "default" / "not configured".
    POLZA_BASE_URL: ${POLZA_BASE_URL:-}
    POLZA_API_KEY: ${POLZA_API_KEY:-}
    # Shared data files (bank rules, holidays) are mounted read-only below.
    SHARED_DATA_DIR: /shared-data
    # Attachment files (stage 7) live on their own volume; the database backup does not cover it.
    FILES_DIR: /data/files
    # Servers: monitoring and Telegram (stage 9). The bot token and chat id are secrets: they live
    # only in deploy/.env on the server (empty = alerts are queued but not sent).
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    MONITOR_ENGINE_URL: http://gatus:8080
    MONITOR_CONFIG_PATH: /monitor/config.yaml
    MONITOR_TIMEZONE: ${MONITOR_TIMEZONE:-}
    MONITOR_QUIET_START: ${MONITOR_QUIET_START:-}
    MONITOR_QUIET_END: ${MONITOR_QUIET_END:-}
  volumes:
    - files:/data/files
    - ../shared-data:/shared-data:ro
  networks: [internal]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [internal]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *backend
    command: ["python", "-m", "tasker.db_migrations"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # `monitor` reaches the check engine ("Check now"); the api never executes checks itself.
    networks: [internal, monitor]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "tasker.worker"]
    # The worker writes the engine config (from the data of the owner) into `monitor_config` and
    # reads the engine's results; `monitor` is the network it shares with the engine.
    networks: [internal, monitor]
    volumes:
      - files:/data/files
      - ../shared-data:/shared-data:ro
      - monitor_config:/monitor
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Check engine (stage 9). Decision of the orchestrator: Gatus (see docs/specs/stage9_monitoring.md,
    # section 1; the owner may choose Uptime Kuma instead). The configuration is generated by the
    # worker from the owner's servers/projects/checks into the `monitor_config` volume; it holds
    # no secrets. The engine sits in its OWN network, away from PostgreSQL and the api, and
    # publishes no ports: only the worker and the api reach it.
  gatus:
    image: ${GATUS_IMAGE:-twinproduct/gatus:stable}
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - monitor_config:/config:ro
      - gatus_data:/data
    networks: [monitor]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    environment:
      SERVER_IP: ${SERVER_IP:?set SERVER_IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  internal:
  monitor:

volumes:
  pgdata:
  files:
  monitor_config:
  gatus_data:
  caddy_data:
  caddy_config:

name: my_tasker
description: "My Tasker — личная система трекинга жизни (Android + Windows)."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Состояние и DI
  flutter_riverpod: ^3.4.3
  # Навигация
  go_router: ^18.0.2
  # HTTP-клиент (с pinning сертификата)
  dio: ^5.11.1
  crypto: ^3.0.7
  # Локальная БД (Drift поверх SQLCipher через build hook пакета sqlite3)
  drift: ^2.35.0
  sqlite3: ^3.6.0
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # Иконки (Lucide, ISC — см. 02_DESIGN_SYSTEM 2.6)
  lucide_icons_flutter: ^3.1.20
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10

  riverpod: any
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  # Этап 10: офлайн-ИИ на телефоне (LiteRT-LM: Gemma 4 E2B). Платформенный
  # адаптер — lib/core/local_llm/flutter_gemma_engine.dart.
  flutter_gemma: ^1.11.3
  flutter_gemma_litertlm: ^1.8.5
  # statvfs через FFI: свободное место перед загрузкой модели.
  ffi: ^2.1.0
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  very_good_analysis: ^11.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/licenses/
    # Копии shared-data (байт-в-байт, сверяет тест): праздники и данные Банков.
    - assets/calendar/
    - assets/banks/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# SQLCipher вместо обычного SQLite: сборка подтягивается build hook-ом пакета
# sqlite3 (см. doc/hook.md пакета). Действует и для `flutter test`, поэтому
# тесты шифрования работают на настоящем SQLCipher.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
